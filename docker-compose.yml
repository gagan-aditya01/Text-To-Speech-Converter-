version: "3.9"

services:
  voicecraft:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: voicecraft:latest
    container_name: voicecraft
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - TTS_ENGINE=${TTS_ENGINE:-gtts}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - voicecraft_output:/app/output
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  voicecraft_output:
    driver: local
