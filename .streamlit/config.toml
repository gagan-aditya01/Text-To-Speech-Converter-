[theme]
base            = "light"
primaryColor    = "#8B7355"
backgroundColor = "#F9F7F3"
secondaryBackgroundColor = "#F2EFE9"
textColor       = "#2C2C2C"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = true
maxUploadSize   = 10

[browser]
gatherUsageStats = false

[runner]
fastReruns      = true
